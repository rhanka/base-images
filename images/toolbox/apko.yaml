# toolbox jobs image: busybox, s5cmd, postgresql-18-client, curl, jq. For Jobs, init containers and kubectl debug. Shell (busybox) allowed, no package manager, no kubectl.
contents:
  keyring:
    - ./keys/wolfi-signing.rsa.pub
  repositories:
    - https://packages.wolfi.dev/os
  packages:
    - wolfi-baselayout
    - ca-certificates-bundle
    - tzdata
    - busybox
    - s5cmd
    - postgresql-18-client
    - curl
    - jq
accounts:
  groups:
    - groupname: nonroot
      gid: 65532
  users:
    - username: nonroot
      uid: 65532
      gid: 65532
      homedir: /home/nonroot
      shell: /bin/sh
  run-as: "65532"

work-dir: /home/nonroot
paths:
  - path: /home/nonroot
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755

cmd: /bin/sh

environment:
  PATH: /usr/sbin:/sbin:/usr/bin:/bin
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
  HOME: /home/nonroot
annotations:
  org.opencontainers.image.source: https://github.com/rhanka/base-images
  org.opencontainers.image.vendor: rhanka
  org.opencontainers.image.title: ghcr.io/rhanka/base/toolbox

archs:
  - x86_64
  - aarch64

layering:
  strategy: origin
  budget: 10
