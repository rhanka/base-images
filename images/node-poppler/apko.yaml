# node-poppler:26 runtime image: node:26 + poppler-utils (pdftotext, pdftoppm, ...). No shell, no package manager.
contents:
  keyring:
    - ./keys/wolfi-signing.rsa.pub
  repositories:
    - https://packages.wolfi.dev/os
  packages:
    - wolfi-baselayout
    - ca-certificates-bundle
    - tzdata
    - nodejs-26-official
    - poppler-utils
accounts:
  groups:
    - groupname: nonroot
      gid: 65532
  users:
    - username: nonroot
      uid: 65532
      gid: 65532
      homedir: /home/nonroot
      shell: /sbin/nologin
  run-as: "65532"

work-dir: /app
paths:
  - path: /home/nonroot
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /app
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
entrypoint:
  command: /usr/bin/node

environment:
  PATH: /usr/sbin:/sbin:/usr/bin:/bin
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt

annotations:
  org.opencontainers.image.source: https://github.com/rhanka/base-images
  org.opencontainers.image.vendor: rhanka
  org.opencontainers.image.title: ghcr.io/rhanka/base/node-poppler

archs:
  - x86_64
  - aarch64

layering:
  strategy: origin
  budget: 10
