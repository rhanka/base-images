# web runtime image: nginx mainline, port 8080, non-root, pid and temp files under /tmp, logs to stdout/stderr. No shell, no package manager.
contents:
  keyring:
    - ./keys/wolfi-signing.rsa.pub
  repositories:
    - https://packages.wolfi.dev/os
  packages:
    - wolfi-baselayout
    - ca-certificates-bundle
    - tzdata
    - nginx-mainline
    - nginx-mainline-mime-types
    - nginx-unprivileged-config
accounts:
  groups:
    - groupname: nonroot
      gid: 65532
  users:
    - username: nonroot
      uid: 65532
      gid: 65532
      homedir: /home/nonroot
      shell: /sbin/nologin
  run-as: "65532"

work-dir: /usr/share/nginx/html
paths:
  - path: /home/nonroot
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755

entrypoint:
  command: /usr/sbin/nginx -e stderr
cmd: -g "daemon off;"
stop-signal: SIGQUIT

environment:
  PATH: /usr/sbin:/sbin:/usr/bin:/bin
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt

annotations:
  org.opencontainers.image.source: https://github.com/rhanka/base-images
  org.opencontainers.image.vendor: rhanka
  org.opencontainers.image.title: ghcr.io/rhanka/base/web

archs:
  - x86_64
  - aarch64

layering:
  strategy: origin
  budget: 10
