# nginx configuration for the web image: listens on 8080, runs as any uid, writes only under /tmp,
# logs to stdout/stderr. Configuration files only, no code. Tenants replace
# /etc/nginx/conf.d/default.conf with their own server block.
package:
  name: nginx-unprivileged-config
  version: "1.0.0"
  epoch: 0
  description: "nginx.conf for non-root, read-only-rootfs nginx on port 8080"
  copyright:
    - license: Apache-2.0
  target-architecture:
    - x86_64
    - aarch64
  dependencies:
    provides:
      - nginx-config=1.0.0

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - busybox

pipeline:
  - runs: |
      install -Dm644 files/nginx/nginx.conf "${{targets.destdir}}/etc/nginx/nginx.conf"
      install -Dm644 files/nginx/default.conf "${{targets.destdir}}/etc/nginx/conf.d/default.conf"
      install -Dm644 files/nginx/index.html "${{targets.destdir}}/usr/share/nginx/html/index.html"

update:
  enabled: false
