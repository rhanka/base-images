# node-dev:26 development image: node:26 + npm, busybox, bash, git, apk-tools. For build stages, CI and dev containers only, never as a service. No C toolchain, no Python: node-gyp source builds fail by design.
contents:
  keyring:
    - ./keys/wolfi-signing.rsa.pub
  repositories:
    - https://packages.wolfi.dev/os
  packages:
    - wolfi-baselayout
    - ca-certificates-bundle
    - tzdata
    - nodejs-26-official
    - nodejs-26-official-npm
    - busybox
    - bash
    - git
    - openssh-client
    - apk-tools
    - wolfi-keys
accounts:
  groups:
    - groupname: nonroot
      gid: 65532
  users:
    - username: nonroot
      uid: 65532
      gid: 65532
      homedir: /home/nonroot
      shell: /bin/bash
  run-as: "65532"

work-dir: /app
paths:
  - path: /home/nonroot
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /app
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
cmd: /bin/bash

environment:
  PATH: /usr/sbin:/sbin:/usr/bin:/bin
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
  HOME: /home/nonroot
annotations:
  org.opencontainers.image.source: https://github.com/rhanka/base-images
  org.opencontainers.image.vendor: rhanka
  org.opencontainers.image.title: ghcr.io/rhanka/base/node-dev

archs:
  - x86_64
  - aarch64

layering:
  strategy: origin
  budget: 10
