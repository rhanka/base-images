# e2e TRIAL image: node-dev:26 + the shared libraries Chromium headless needs + fonts. The browser itself comes from the tenant's Playwright version (npx playwright install chromium). Not published as a supported image while the trial runs.
contents:
  keyring:
    - ./keys/wolfi-signing.rsa.pub
  repositories:
    - https://packages.wolfi.dev/os
  packages:
    - wolfi-baselayout
    - ca-certificates-bundle
    - tzdata
    - nodejs-26-official
    - nodejs-26-official-npm
    - busybox
    - bash
    - git
    - alsa-lib
    - libatk-1.0
    - libatk-bridge-2.0
    - at-spi2-core-libatspi
    - cairo
    - cups-libs
    - dbus-libs
    - expat
    - fontconfig
    - font-liberation
    - glib
    - libdrm
    - libnspr
    - libnss
    - libudev
    - libx11
    - libxcb
    - libxcomposite
    - libxdamage
    - libxext
    - libxfixes
    - libxkbcommon
    - libxrandr
    - mesa-gbm
    - pango
accounts:
  groups:
    - groupname: nonroot
      gid: 65532
  users:
    - username: nonroot
      uid: 65532
      gid: 65532
      homedir: /home/nonroot
      shell: /bin/bash
  run-as: "65532"

work-dir: /app
paths:
  - path: /home/nonroot
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /app
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
cmd: /bin/bash

environment:
  PATH: /usr/sbin:/sbin:/usr/bin:/bin
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
  HOME: /home/nonroot
annotations:
  org.opencontainers.image.source: https://github.com/rhanka/base-images
  org.opencontainers.image.vendor: rhanka
  org.opencontainers.image.title: ghcr.io/rhanka/base/e2e

archs:
  - x86_64
  - aarch64

layering:
  strategy: origin
  budget: 10
