# CHECK ONLY (not published, not a P1 image): node:26 + the reduced GDAL from the melange workshop.
# Proves that gdal-tools-geo resolves against Wolfi gdal, passes the runtime gates and runs. The geo-gdal
# tenant variant itself is P3 (design r2, section 5.4).
contents:
  keyring:
    - ./keys/wolfi-signing.rsa.pub
  repositories:
    - https://packages.wolfi.dev/os
  packages:
    - wolfi-baselayout
    - ca-certificates-bundle
    - tzdata
    - nodejs-26-official
    - gdal-tools-geo
accounts:
  groups:
    - groupname: nonroot
      gid: 65532
  users:
    - username: nonroot
      uid: 65532
      gid: 65532
      homedir: /home/nonroot
      shell: /sbin/nologin
  run-as: "65532"

work-dir: /app
paths:
  - path: /home/nonroot
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /app
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
entrypoint:
  command: /usr/bin/node

environment:
  PATH: /usr/sbin:/sbin:/usr/bin:/bin
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt

annotations:
  org.opencontainers.image.source: https://github.com/rhanka/base-images
  org.opencontainers.image.vendor: rhanka
  org.opencontainers.image.title: geo-gdal-check

archs:
  - x86_64
  - aarch64

layering:
  strategy: origin
  budget: 10
